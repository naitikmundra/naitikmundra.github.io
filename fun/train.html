<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>

#gate,#pause,#tc{display:none}

.tb.on{background:#e8b923;color:#111;box-shadow:0 0 14px #e8b923}

#pEnd{border-color:#b3261e!important;color:#ff8a7a!important}
</style></head><body>
<canvas id="c"></canvas>
<div id="fps">FPS --</div>
<div id="hint"></div>
<div id="tools"><button id="tod" class="dev">🕒 Time: Auto (N)</button><button id="rn" class="dev">🌧 Rain: Auto (P)</button><button id="fp" class="dev">📊 FPS: On (F)</button><button id="mute">🔊 Sound on (M)</button></div>

<div id="gate"><div id="gi">📱</div><div id="gt"></div><div id="gsub"></div><button id="gb">⛶ Enter full screen</button></div>
<div id="tc">
  <div id="lcol"><button class="tb" id="bPause">⏸ PAUSE</button><button class="tb" id="bLamp">LIGHT</button><button class="tb" id="bSand">SAND</button></div>

</div>
<div id="pause"><h2>PAUSED</h2><div id="pinfo"></div><button id="pRes">▶ Resume</button><button id="pRul">📖 Rules</button><button id="pEnd">■ End run</button></div>

<script>
const cv=document.getElementById('c');let g=cv.getContext('2d');
let W,H;
/* phone / tablet with touch as primary input */
const TOUCH=(()=>{try{return matchMedia('(pointer:coarse)').matches&&navigator.maxTouchPoints>0}catch(e){return false}})();
const QMAX=Math.min(devicePixelRatio||1,2);let QS=QMAX;
function rs(){const d=QS;W=innerWidth;H=innerHeight;cv.width=Math.round(W*d);cv.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}
addEventListener('resize',rs);rs();
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mix=(a,b,t)=>'rgb('+Math.round(a[0]+(b[0]-a[0])*t)+','+Math.round(a[1]+(b[1]-a[1])*t)+','+Math.round(a[2]+(b[2]-a[2])*t)+')';
const lr=(a,b,t)=>a.map((c,i)=>c+(b[i]-c)*t),rgb=a=>`rgb(${a.map(Math.round).join()})`;
let FOG=[190,208,212];const mmss=t=>Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');
// ground colours per forest kind: 0 mixed, 1 dense pine, 2 autumn, 3 open farmland
const KC=[[[111,138,90],[58,72,41]],[[74,104,70],[34,52,32]],[[146,128,66],[84,64,34]],[[164,152,84],[112,98,50]]];
const TODS=[0,.5,.74,.92,.26],TODN=['Auto','Day','Sunset','Night','Sunrise'],RNN=['Auto','Off','Light','Heavy'];

/* ---------- rules / tuning ---------- */
const TOL=5;
const FINE_RED=50, FINE_SPD=25;
const MAXF=200;            /* run ends when total citation fines go above this */
const SUNRISE=.26;         /* every run starts at sunrise */
const DAYLEN=480;          /* seconds of run time for one full day/night cycle (independent of speed) */
/* expected-time model */
const EXP_K=1.2;           /* allowance on time spent running at posted limits (accel/brake) */
const EXP_SIGN=3;          /* seconds per speed sign */
const EXP_STN=40;          /* seconds per station (stop + dwell + restart) */
const EXP_SIG=5;           /* seconds per signal */
const EXP_RED=30;          /* extra seconds per signal that was red */
const PTS_KM=100;          /* points per km before time factor */
const RULES=["1. AMBER board RED: home signal ahead is red. Slow.",
"2. Home signal RED = STOP. YELLOW = proceed.",
"3. Obey the last speed limit sign you passed.",
`4. Over the limit by ${TOL}+ km/h = citation ($${FINE_SPD}).`,
`5. Passing a red signal = citation ($${FINE_RED}).`,
"6. STOP board: stop, wait for YELLOW.",
"7. Overrun / stopping short of platform ($30/$20).",
"8. No stops on the line or at unlisted stations.",
TOUCH?"9. Blue W board: sound horn (hold HORN) before the":"9. Blue W board: sound horn (hold H) before the",
"    crossing / bridge / station ahead ($25).",
"10. Sound horn before every start from rest ($20).",
TOUCH?"11. SLIP lamp on: hold SAND 1 s within 10 s ($30).":"11. SLIP lamp on: hold E (sand) 1 s within 10 s ($30).",
TOUCH?"12. Headlight (LIGHT) on in dusk, dark, heavy rain ($20).":"12. Headlight (L) on in dusk, dark, heavy rain ($20).",
"Wheel slip strikes at random. Keep sand in stock.",
`Fines over $${MAXF} end your run (licence suspended).`,
"Fines are NOT part of the score.",
"Score = distance x time factor, where factor =",
"expected time / your time. Expected time comes from",
"distance, speed signs, stations and signals.",
TOUCH?"Pause (top-left) > End run to finish.":"Press Q to end your run."];

/* ---------- state ---------- */
let st='title',book=false,day=1,clock=0,idle=0,s,v,thr,brk,limit,objs,dv,dthr,dbrk,over,grace,spdCd,fines,ncite,slip,cn=0,T=0,lastClick=0;
let runT=0,nSign=0,nStn=0,nSig=0,nRed=0,endWhy='',devMode=false,devRun=false,dq=0,sumScore=0,newBest=false;
let gateOK=!TOUCH,pz=false;   /* gateOK: phone is landscape + fullscreen; pz: touch pause menu */
const keys={};
let gv=0,gt=0,gd=0;
let lamp=false,sand=100,sandT=0,slipping=false,slipT=0,mu=1.05,muEff=1.05,hk=99,hh=0,moving=false,darkT=0,sanding=false;
let TOD=SUNRISE,EL=1,LV=1,WARM=0,RAIN=0,KZ=[],RZ=[],RV=[],XG=[],BR=[],GC=[111,138,90],GB=[58,72,41],LT=[],TR=[];
let STL=[],STN=[],sandHold=0,slipNext=90,dem=0,wph=0,GZ=[],todMode=0,rainMode=0,NSTN=12,best=(()=>{try{const x=localStorage.getItem('nightline_best_v2');return x===null?null:+x}catch(e){return null}})();
const kindAt=x=>(KZ.find(z=>x>=z.a&&x<z.b)||KZ[KZ.length-1]).k;
const rainAt=x=>RZ.reduce((m,z)=>Math.max(m,z.i*clamp((x-z.a)/350,0,1)*clamp((z.b-x)/350,0,1)),0);
const gripAt=x=>{let f=1;KZ.forEach(z=>{if(z.k==2)f=Math.min(f,1-.38*clamp((x-z.a)/200,0,1)*clamp((z.b-x)/200,0,1))});GZ.forEach(z=>{f=Math.min(f,1-(1-z.m)*clamp((x-z.a)/200,0,1)*clamp((z.b-x)/200,0,1))});return f};
const rainTarget=()=>(devMode&&rainMode)?[0,0,.45,1][rainMode]:rainAt(s);
function env(dt){
  /* time of day depends only on elapsed run time (clock), never on distance or speed */
  TOD=(devMode&&todMode)?TODS[todMode]:(SUNRISE+clock/DAYLEN)%1;
  EL=Math.sin(2*Math.PI*(TOD-.25));LV=clamp((EL+.12)/.35,0,1);WARM=clamp(1-Math.abs(EL)/.3,0,1);
  RAIN+=(rainTarget()-RAIN)*Math.min(1,dt*.8);
  let f=lr([190,208,212],[138,148,154],RAIN*.8);f=lr(f,[22,28,46],1-LV);FOG=lr(f,[232,172,132],WARM*.4*LV);
  const kt=KC[kindAt(s+150)],k=Math.min(1,dt*.8);GC=lr(GC,kt[0],k);GB=lr(GB,kt[1],k);
}
function newShift(){day=Math.random()*1000;
  s=0;v=0;thr=0;brk=1;idle=0;limit=40;dv=0;dthr=0;dbrk=1;over=0;grace=0;spdCd=0;fines=0;ncite=0;slip=null;
  clock=0;runT=0;nSign=0;nStn=0;nSig=0;nRed=0;endWhy='';devRun=devMode;newBest=false;pz=false;
  lamp=false;sand=100;sandT=0;slipping=false;slipT=0;slipNext=60+Math.random()*120;sandHold=0;mu=1.05;muEff=1.05;hk=99;hh=0;moving=false;darkT=0;sanding=false;
  objs=[];STL=[];STN=[];BR=[];XG=[];KZ=[];RZ=[];RV=[];GZ=[];occ=[];CP=[[0,20]];IDL=20;PS=0;LM=40;SEC=0;GEN=0;KE=0;RE=1500+rnd(day*3)*2000;VE=1000;ki=0;ri=0;vi=0;pk=-1;served=0;missed=0;recent=[];
  while(GEN<3500)genSection();
  {const kt=KC[kindAt(0)];GC=kt[0].slice();GB=kt[1].slice()}
  RAIN=rainTarget();
}
let occ=[],CP=[[0,20]],IDL=20,PS=0,LM=40,SEC=0,GEN=0,KE=0,RE=0,VE=0,ki=0,ri=0,vi=0,pk=-1,served=0,missed=0,recent=[];
const PRE=['Pine','Marsh','Birch','Iron','Cold','Ash','Mill','Raven','Elm','Stone','Wren','Fox','Kettle','Alder','Harrow','Dun','Salt','Lark','Thorn','Wick','Copper','Hazel','Oak','Swan','Fen','Moss','Red','Cinder','Ivy','Grey','Linden','Nettle','Briar','Quarry','Willow','Sedge'];
const SUF=['Hollow','Cross','Lane','Bridge','Spring','Halt','Brook','Gap','Junction','Haven','Valley','Moor','Ford','Hill','Mere','Green','Dale','Reach','Lake','Gate','Water','Row','Park','Fold','Cliff','End','Bank','Run'];
function pickName(sd){for(let i=0;i<40;i++){const n=PRE[Math.floor(rnd(sd+i*3.7)*PRE.length)]+' '+SUF[Math.floor(rnd(sd*1.3+i*5.9+2)*SUF.length)];if(!recent.includes(n)){recent.push(n);if(recent.length>60)recent.shift();return n}}return'Halt '+Math.floor(sd)}
function extZones(to){
  while(KE<to){const a=KE,l=700+rnd(a+day*9)*1100;let k=[0,1,1,2,2,3,3][Math.floor(rnd(a*1.7+day*5+ki)*7)];if(k==pk)k=(k+1)%4;KZ.push({a,b:a+l,k});pk=k;KE=a+l;ki++}
  while(RE<to){if(rnd(RE*.7+day*11+ri)<.6){const l=2000+rnd(RE+day)*3500;RZ.push({a:RE,b:RE+l,i:.5+rnd(RE*.3+day)*.5});RE+=l+2500+rnd(RE)*3000}else RE+=2500;ri++}
  while(VE<to){const a=1000+vi*4000+rnd(day*4+vi)*1500;RV.push({a,b:a+900+rnd(a)*900,sd:rnd(day*6+vi)<.5?-1:1});vi++;VE=1000+vi*4000}
}
const LIMS=[40,60,80,100,100,120,120,150,150,150];
function genSection(){
  objs=objs.filter(o=>o.s>s-1500);occ=occ.filter(r=>r[1]>s-3000);STN=STN.filter(o=>o.s>s-3500);STL=STL.filter(o=>o.s>s-3500);BR=BR.filter(o=>o.s+o.len>s-800);XG=XG.filter(o=>o.s>s-800);KZ=KZ.filter(z=>z.b>s-3000);RZ=RZ.filter(z=>z.b>s-3000);RV=RV.filter(z=>z.b>s-3000);while(CP.length>3&&CP[2][0]<s-2000)CP.shift();
  const k=SEC++,R=a=>rnd(k*7.31+a*2.17+day),pick=(A,a)=>A[Math.floor(R(a)*A.length)];
  const b=GEN,ex=k>0&&R(1)<.28,Ls=k==0?2300+Math.floor(R(2)*500):ex?6000+Math.floor(R(2)*900):3300+Math.floor(R(2)*900),q=b+Ls;
  const sec=[],add=o=>{sec.push(o);objs.push(o);return o},inEx=x=>ex&&x>b+100&&x<q-950,bad=(a,c)=>occ.some(r=>c>r[0]&&a<r[1]);
  if(k==0)add({t:'sign',s:30,lim:40,fx:1});else add({t:'sign',s:b+80,lim:ex?150:pick([100,120,150],3),fx:1});
  const nm=pickName(k*9.7+day*2.1),stn=add({t:'stn',s:q,name:nm,state:0,w:0});STN.push(stn);STL.push(stn);
  add({t:'sign',s:q-900,lim:pick([100,120],4),fx:1});add({t:'sign',s:q-450,lim:pick([60,80],5),fx:1});
  add({t:'hs',s:q-420,cs:q-120,nm,hk:0,done:0});occ.push([q-1000,q+130]);
  if(k>0){const u=b+(ex?2900:1600)+Math.floor(R(6)*200),un=pickName(k*5.3+day*1.7+9),o=add({t:'ustn',s:u,name:un,we:0});STL.push(o);occ.push([u-450,u+130]);add({t:'hs',s:u-400,cs:u-100,nm:un,hk:0,done:0})}
  if(ex)for(let x=b+1200;x<q-1250;x+=1300)if(!bad(x-100,x+100))add({t:'sign',s:x,lim:150,fx:1});
  /* bridges and level crossings: at most one per 1500 m window, never overlapping other features */
  for(let i=0,x=b+600;x<q-1100;i++,x+=1500){const r=R(20+i),pos=x+Math.floor(R(40+i)*1100);
    if(r<.45){const len=70+Math.floor(R(60+i)*100);if(pos+len<q-1100&&!bad(pos-340,pos+len+80)){BR.push({s:pos,len});occ.push([pos-330,pos+len+70]);
      add({t:'sign',s:pos-250,lim:inEx(pos-250)?150:80,fx:1});add({t:'sign',s:pos+len+60,lim:inEx(pos)?150:100,fx:1});add({t:'hs',s:pos-300,cs:pos,nm:'bridge',hk:0,done:0})}}
    else if(r<.9&&pos<q-1100&&!bad(pos-340,pos+80)){XG.push({s:pos});occ.push([pos-330,pos+70]);add({t:'hs',s:pos-300,cs:pos,nm:'level crossing',hk:0,done:0})}}
  /* random signs and signal pairs, min spacing enforced */
  for(let p=b+250;;){p+=260+rnd(p+day)*320;if(p>q-1250)break;if(inEx(p))continue;
    if(rnd(p*3+day)<.6){if(!bad(p-120,p+120))add({t:'sign',s:p,lim:LIMS[Math.floor(rnd(p*7+day)*LIMS.length)]})}
    else if(!bad(p-220,p+760)&&!inEx(p+760)){const rd=rnd(p*5+day)<.5,h={t:'sig',s:p+500,red:rd,r0:rd,w:0,done:0};add({t:'sign',s:p-100,lim:80,fx:1});add({t:'dsig',s:p,ref:h});add(h);p+=560}}
  sec.sort((a,c)=>a.s-c.s);
  sec.forEach(o=>{IDL+=(o.s-PS)/(LM/3.6);PS=o.s;
    if(o.t=='sign'){if(!o.fx&&o.lim==LM){let n=o.lim;for(let i=0;n==LM&&i<9;i++)n=LIMS[Math.floor(rnd(o.s*1.3+i*5.1+day)*LIMS.length)];o.lim=n}LM=o.lim}
    else if(o.t=='stn'||(o.t=='sig'&&o.red))IDL+=35;
    CP.push([o.s,IDL])});
  GEN=q;extZones(q+3500);
}
/* Score: distance x time factor. Expected time is built from the course actually passed:
   time at posted limits + per speed sign + per station + per signal (+ extra if it was red). */
function calc(){
  const km=s/1000,exp=runT*EXP_K+nSign*EXP_SIGN+nStn*EXP_STN+nSig*EXP_SIG+nRed*EXP_RED;
  const tf=clock>1?clamp(exp/clock,.4,1.25):1;
  return{km,exp,tf,score:Math.round(km*PTS_KM*tf)}
}
function finish(){st='sum';cq=false;slip=null;const c=calc();sumScore=c.score;newBest=false;
  if(!devRun){if(best===null||c.score>best){best=c.score;newBest=true}try{localStorage.setItem('nightline_best_v2',String(best))}catch(e){}}}
newShift();
function cite(txt,fine){fines+=fine;ncite++;slip={txt,fine,n:++cn,t:0};stamp()}

function update(dt){
  const K=keys;clock+=dt;if(GEN<s+3500)genSection();
  if(K.ArrowUp||K.KeyW)thr+=.5*dt;if(K.ArrowDown||K.KeyS)thr-=.7*dt;
  if(K.ArrowRight||K.KeyD)brk+=.6*dt;if(K.ArrowLeft||K.KeyA)brk-=.8*dt;
  thr=clamp(thr,0,1);brk=clamp(brk,0,1);
  const be=K.Space?1:brk,te=thr;
  /* adhesion, sanding, slip */
  sanding=!!K.KeyE&&sand>0;
  if(sanding){sand=Math.max(0,sand-2*dt);sandT=7}else sandT=Math.max(0,sandT-dt);
  /* random wheel-slip event: lamp lights, hold sand 1 s within 10 s or be cited */
  if(!slipping){if(v>1){slipNext-=dt;if(slipNext<=0){slipping=true;slipT=0;sandHold=0}}}
  else{slipT+=dt;if(sanding){sandHold+=dt;if(sandHold>=1){slipping=false;slipNext=90+Math.random()*150}}
    else if(slipT>10){if(sand>0)cite('Wheel slip: sand not applied',30);slipping=false;slipNext=90+Math.random()*150}}
  muEff=slipping?.35:1.05;
  /* headlight rule */
  const ll=LV*(1-.4*RAIN);
  if(ll<.5&&!lamp&&v>2){darkT+=dt;if(darkT>6){cite('Headlight off in poor light',20);darkT=-25}}
  else darkT=darkT<0?Math.min(0,darkT+dt):0;
  /* horn */
  if(K.KeyH){hh+=dt;hk=0}else{hh=0;hk+=dt}
  const hornGood=hh>.4;
  if(v<.2)moving=false;else if(!moving&&v>=.5){moving=true;if(hk>12)cite('Started moving without sounding horn',20)}
  const acc=te*1.3*Math.max(0,1-(v/48)**2)*(slipping?.5:1),dec=be*1.3*(slipping?.8:1)+.02+v*v*.00004;
  v=Math.max(0,v+(acc-dec)*dt);s+=v*dt;
  runT+=v*dt/(limit/3.6);   /* time it would take at the posted limit */
  const k=Math.min(1,dt*4);dv+=(v-dv)*k;dthr+=((te+(slipping?.25:0))-dthr)*k;dbrk+=(be-dbrk)*k;
  const kmh=v*3.6;
  let allow=limit+TOL;
  if(grace>0){gt+=dt;allow=Math.max(allow,gv-3.5*Math.max(0,gt-gd));if(allow<=limit+TOL)grace=0}
  if(spdCd>0)spdCd-=dt;
  if(kmh>allow&&spdCd<=0){over+=dt;if(over>2.5){cite(`Speeding: ${Math.round(kmh)} km/h in a ${limit} zone`,FINE_SPD);spdCd=20;over=0}}
  else over=Math.max(0,over-dt*2);
  for(const o of objs){
    if(o.t=='sign'&&!o.done&&s>=o.s){o.done=1;nSign++;if(o.lim<limit&&kmh>o.lim+TOL){grace=1;gv=kmh;gt=0;gd=4+(kmh-o.lim)*.05}else grace=0;limit=o.lim;spdCd=0;over=0}

  if(two){half=Math.ceil(lines.length/2);while(lines[half]&&lines[half][0]==' ')half++}
  const rows=two?Math.max(half,lines.length-half):lines.length,ml=Math.max(...lines.map(t=>t.length)),
    w=two?Math.min(W*.96,1000):Math.min(W*.92,560),
    fs=two?Math.min(15,(w/2-20)/(ml*.6),H*.94/(1.5*(rows+5)+1)):Math.min(16,w/34,H*.94/(1.5*(rows+5)+1)),
    lh=fs*1.5,h=(rows+5)*lh+fs;
  g.save();g.translate(W/2,H/2);g.rotate(rot);g.shadowColor='#000b';g.shadowBlur=30;g.fillStyle='#e6dfc4';g.fillRect(-w/2,-h/2,w,h);g.shadowBlur=0;
  g.fillStyle='#1b1a16';g.textAlign='left';g.textBaseline='top';
  g.font=`bold ${fs*1.4}px "Courier New",monospace`;g.fillText(title,-w/2+fs,-h/2+fs);
  g.font=`${fs}px "Courier New",monospace`;lines.forEach((t,i)=>{const c=two&&i>=half?1:0,r=c?i-half:i;g.fillText(t,-w/2+fs+c*(w/2),-h/2+fs+lh*2+r*lh)});
  g.fillStyle='#6b1d14';g.font=`italic ${fs}px "Courier New",monospace`;g.fillText(foot,-w/2+fs,h/2-fs*2);g.restore();
}
function drawSlip(){
  if(!slip)return;const w=Math.min(W*.5,300),h=150,k=1-clamp(slip.t*3,0,1),fade=clamp((8-slip.t)*2,0,1),fs=Math.max(11,w/24);
  g.save();g.globalAlpha=fade;g.translate(W*.72,H*.3+k*H);g.rotate(.05);g.shadowColor='#000b';g.shadowBlur=18;g.fillStyle='#f0ead2';g.fillRect(-w/2,-h/2,w,h);g.shadowBlur=0;
  g.fillStyle='#1b1a16';g.textAlign='left';g.textBaseline='top';g.font=`bold ${fs*1.2}px "Courier New",monospace`;g.fillText('CITATION #'+String(slip.n).padStart(4,'0'),-w/2+10,-h/2+10);
  g.font=`${fs}px "Courier New",monospace`;
  const words=slip.txt.split(' ');let line='',y=-h/2+fs*3;for(const wd of words){if((line+wd).length*fs*.6>w-20){g.fillText(line,-w/2+10,y);y+=fs*1.3;line=''}line+=wd+' '}g.fillText(line,-w/2+10,y);
  g.font=`bold ${fs*1.2}px "Courier New",monospace`;g.fillText('FINE: $'+slip.fine,-w/2+10,h/2-fs*2.2);
  g.save();g.translate(w*.2,h*.22);g.rotate(-.25);g.strokeStyle=g.fillStyle='#b3261e';g.lineWidth=3;g.strokeRect(-38,-15,76,30);g.textAlign='center';g.textBaseline='middle';g.font='bold 20px "Courier New",monospace';g.fillText('CITED',0,0);g.restore();
  g.restore();
}

function vig(){g.drawImage(layers().V,0,0,W,H)}
function render(){
  g.clearRect(0,0,W,H);const k=st=='drive'?clamp(v/25,0,1):0;
  g.save();g.translate(Math.sin(s*.8)*1.5*k+Math.sin(T*1.3)*.5,Math.sin(s*1.7)*1.2*k);world();g.restore();
  night();rainFX();cab();
  if(LV<.6){g.fillStyle=`rgba(0,0,10,${(.6-LV)*.4})`;g.fillRect(0,H*.6,W,H*.4)}
  vig();
  if(st!='drive'||book||cq||dq||pz||!gateOK){g.fillStyle='rgba(0,0,0,.6)';g.fillRect(0,0,W,H)}
  drawSlip();
  if(dq==1)sheet('DEV MODE',['Turn on developer tools?','','Adds buttons for time of day, rain','and FPS display.','','SCORE WILL NOT BE COUNTED while dev','mode is on (this run and its high','score are ignored).','','Y / ENTER ... yes, turn on dev mode','N / ESC ..... no, cancel'],'The game is paused',.008);
  else if(dq==2)sheet('DEV MODE',['Dev mode is ON.','','Turn it off and hide the dev buttons?','','Note: this run stays uncounted.','','Y / ENTER ... yes, turn off','N / ESC ..... no, keep it on'],'The game is paused',.008);
  else if(!gateOK)0;
  else if(st=='title')sheet('NIGHT LINE - TRAIN SHIFT',TOUCH?["No HUD. Read your gauges and the trackside.","","THROTTLE ... drag the left lever (right = power)","BRAKE ....... drag the right lever (right = brake)","HORN ........ hold the HORN button","SAND ........ hold the SAND button","LIGHT ....... tap the LIGHT button","PAUSE ....... button at the top left","SOUND ....... button at the top right","","Sound the horn, release the brake, go."]:["No HUD. Read your gauges and the trackside.","","UP/DOWN or W/S ..... throttle","RIGHT/LEFT or D/A .. apply / release brake","SPACE .............. full brake (same as lever max)","H .................. horn (hold)","E .................. sand (hold)","L .................. headlight","R .................. rulebook (pauses)","M .................. mute sound","Q .................. end run","","Sound the horn, release the brake, go."],TOUCH?'Tap to start':'Click or press ENTER to start');
  else if(st=='book')sheet('BULLETIN - ENDLESS LINE',["Brake is applied. The line never ends.","",...RULES],TOUCH?'Tap to begin your shift':'ENTER to begin your shift',.012);
  else if(st=='sum'){const c=calc();sheet('END OF RUN',[
    "Distance ............. "+c.km.toFixed(1)+" km",
    "Time taken ........... "+mmss(clock),
    "Expected time ........ "+mmss(c.exp),
    "  ("+nSign+" signs, "+nStn+" stations, "+nSig+" signals)",
    "Time factor .......... x"+c.tf.toFixed(2),
    "Citations ............ "+ncite+" ($"+fines+", not scored)",
    "-----------------------------",
    "SCORE ................ "+c.score,
    devRun?"DEV MODE: score not counted":"Rating ............... "+rate(c.score),
    devRun?"":"High score ........... "+(best===null?'--':best)+(newBest?"  NEW!":""),
    "",
    endWhy||(['S','A','B'].includes(rate(c.score))?"Your family is proud of you.":"Your family gets by.")],TOUCH?'Tap for a new run':'ENTER for a new run')}
  else if(book)sheet('RULEBOOK',RULES,TOUCH?'Tap to close':'Press R to close');
  else if(cq)sheet('END RUN?',['End your run and see your score?','','Distance so far: '+(s/1000).toFixed(1)+' km','','Y / ENTER ... yes, end run','N / ESC ..... no, keep driving'],'The game is paused',.01);
}

/* ---------- input / loop ---------- */
function advance(){
  initAudio();
  if(st=='title'){st='book'}
  else if(st=='book'){st='drive'}
  else if(st=='sum'){day++;newShift();st='book'}
}
addEventListener('keydown',e=>{
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  if(e.repeat&&e.code!='KeyH'){keys[e.code]=1;return}
  /* dev-mode confirmation swallows all keys */
  if(dq){
    if(e.code=='KeyY'||e.code=='Enter'){setDev(dq==1);dq=0}
    else if(e.code=='KeyN'||e.code=='Escape')dq=0;
    return}
  if(e.code=='KeyO'&&e.shiftKey&&!cq){dq=devMode?2:1;return}
  keys[e.code]=1;
  if(e.code=='Enter')advance();
  if(e.code=='KeyM')toggleMute();
  if(devMode&&!cq){
    if(e.code=='KeyN')cycleTod();
    if(e.code=='KeyF')toggleFps();
    if(e.code=='KeyP')cycleRain()}
  if(e.code=='KeyL'&&st=='drive'&&!book&&!cq)lamp=!lamp;if(st=='drive'&&!book){if(cq){if(e.code=='KeyY'||e.code=='Enter'){cq=false;finish()}else if(e.code=='KeyN'||e.code=='Escape'||e.code=='KeyQ')cq=false}else if(e.code=='KeyQ')cq=true}
  if((e.code=='KeyR'||e.code=='Tab')&&st=='drive'&&!cq)book=!book;
});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('pointerdown',e=>{const id=e.target.id;
  if(dq)return;
  if(e.target.closest&&e.target.closest('#gate,#tc,#pause'))return;   /* touch UI handles its own taps */
  if(id=='mute'){initAudio();toggleMute();return}
  if(id=='tod'){cycleTod();return}
  if(id=='rn'){cycleRain();return}
  if(id=='fp'){toggleFps();return}
  if(TOUCH&&book&&st=='drive'){book=false;return}   /* tap closes the rulebook (opened from pause menu) */
  if(st!='drive')advance()});
const fpsEl=document.getElementById('fps'),hintEl=document.getElementById('hint'),pf={f:0,t:0,w:0,s:0,lo:0,ok:0,up:0,tryUp:-1e9,chk:0,base:0,old:0,noDown:0};
let hintTxt=null;
function hud(){const show=!TOUCH&&st=='drive'&&!book&&!cq&&!dq,t=show?'Press Q to end run'+(devRun?'  |  DEV MODE: score off':''):'';
  if(t!==hintTxt){hintTxt=t;hintEl.textContent=t;hintEl.style.display=show?'block':'none'}}

/* ---------- touch / phone mode ---------- */
const $=id=>document.getElementById(id);
const gateEl=$('gate'),gi=$('gi'),gt_=$('gt'),gsub=$('gsub'),gb=$('gb'),tcEl=$('tc'),pauseEl=$('pause'),pinfo=$('pinfo'),
  bSlip=$('bSlip'),bSand=$('bSand'),bLamp=$('bLamp'),bHorn=$('bHorn'),bPause=$('bPause');
const FSel=()=>document.fullscreenElement||document.webkitFullscreenElement;
const docEl=document.documentElement,fsReq=docEl.requestFullscreen||docEl.webkitRequestFullscreen,canFS=!!fsReq;
let gateMode=-1;const cs={};
/* gate: must be landscape (and fullscreen where the browser supports it). Losing either pauses the run. */
function checkGate(){
  const land=innerWidth>innerHeight,fs=!!FSel(),mode=!land?1:(canFS&&!fs)?2:0,ok=mode==0;
  if(!ok&&gateOK&&st=='drive'){pz=true;book=false;cq=false;dq=0}
  gateOK=ok;
  if(mode!==gateMode){gateMode=mode;gateEl.style.display=ok?'none':'flex';
    gi.className=mode==1?'rot':'';gi.textContent=mode==1?'📱':'⛶';
    gt_.textContent=mode==1?'Rotate your phone to landscape':mode==2?'Enter full screen to play':'';
    gsub.textContent=mode==1?(canFS?'Then enter full screen to start playing.':'Tip (iPhone): Share > Add to Home Screen for full screen play.'):mode==2?'The game pauses if you leave full screen or rotate to portrait.':'';
    gb.style.display=mode==2?'block':'none'}
}
function syncTC(){
  const drive=st=='drive'&&gateOK,pl=drive&&!book&&!cq&&!pz&&!dq,ps=drive&&pz&&!book&&!cq;
  if(cs.pl!==pl){cs.pl=pl;tcEl.style.display=pl?'block':'none'}
  if(cs.ps!==ps){cs.ps=ps;pauseEl.style.display=ps?'flex':'none';if(ps)pinfo.textContent=(s/1000).toFixed(1)+' km  |  fines $'+fines+'/'+MAXF}
  if(!pl){keys.KeyH=0;keys.KeyE=0;return}
  bSlip.classList.toggle('on',slipping);bSand.classList.toggle('on',sanding);bLamp.classList.toggle('on',lamp);bHorn.classList.toggle('on',!!keys.KeyH);
  const t='SAND\n'+Math.round(sand)+'%';if(cs.sd!==t){cs.sd=t;bSand.textContent=t}
}
function holdBtn(el,code){
  el.addEventListener('pointerdown',e=>{if(!cs.pl)return;keys[code]=1;try{el.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>el.addEventListener(t,()=>{keys[code]=0}));
}
/* lever dragging: press on a lever area, then slide the finger left/right (relative, so the lever never jumps) */
const lvDrag={};
const lvOK=()=>st=='drive'&&gateOK&&!book&&!cq&&!pz&&!dq;
function lvHit(px,py){const G=lvGeo(),hw=G.L*1.6;if(py<G.ly-G.L*1.7)return null;if(Math.abs(px-G.tx)<hw)return't';if(Math.abs(px-G.bx)<hw)return'b';return null}
if(TOUCH){
  docEl.classList.add('touch');
  holdBtn(bHorn,'KeyH');holdBtn(bSand,'KeyE');
  bLamp.addEventListener('pointerdown',e=>{if(cs.pl)lamp=!lamp;e.preventDefault()});
  bPause.addEventListener('pointerdown',e=>{if(cs.pl)pz=true;e.preventDefault()});
  cv.addEventListener('pointerdown',e=>{if(!lvOK())return;const r=cv.getBoundingClientRect(),k=lvHit(e.clientX-r.left,e.clientY-r.top);if(!k)return;
    try{cv.setPointerCapture(e.pointerId)}catch(_){}
    lvDrag[e.pointerId]={k,x0:e.clientX,v0:k=='t'?thr:brk};e.preventDefault()});
  cv.addEventListener('pointermove',e=>{const d=lvDrag[e.pointerId];if(!d||!lvOK())return;
    const G=lvGeo(),span=2*G.L*Math.sin(LSW/2*Math.PI/180),val=clamp(d.v0+(e.clientX-d.x0)/span,0,1);
    if(d.k=='t')thr=val;else brk=val;e.preventDefault()});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,e=>{delete lvDrag[e.pointerId]}));
  $('pRes').addEventListener('click',()=>{pz=false});
  $('pRul').addEventListener('click',()=>{book=true});
  $('pEnd').addEventListener('click',()=>{pz=false;finish()});
  gb.addEventListener('click',()=>{
    initAudio();
    const lock=()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(_){}};
    try{const p=fsReq.call(docEl,{navigationUI:'hide'});if(p&&p.then)p.then(lock).catch(()=>{});else lock()}catch(_){}
    setTimeout(checkGate,300)});
  ['fullscreenchange','webkitfullscreenchange'].forEach(t=>document.addEventListener(t,checkGate));
  ['resize','orientationchange'].forEach(t=>addEventListener(t,checkGate));
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&st=='drive')pz=true});
  addEventListener('contextmenu',e=>e.preventDefault());
  checkGate();
}

function perf(n,ft){
  if(ft<200){pf.f++;pf.t+=ft;if(ft>pf.w)pf.w=ft}
  if(!pf.s)pf.s=n;
  if(n-pf.s<500)return;
  if(pf.f){const avg=pf.t/pf.f;if(devMode&&fpsOn)fpsEl.textContent='FPS '+Math.round(1000/avg)+' | '+avg.toFixed(1)+' ms (max '+pf.w.toFixed(0)+') | res '+QS.toFixed(2)+'x';
    if(n>3000){
      if(pf.chk>0&&--pf.chk==0&&avg>pf.base*.9){QS=pf.old;pf.noDown=n+120000;pf.lo=0;pf.ok=0;rs()}
      else if(avg>22){pf.lo++;pf.ok=0}else{pf.lo=0;pf.ok=avg<18?pf.ok+500:0}
      if(pf.lo>=2&&pf.chk==0&&QS>.5&&n>pf.noDown){pf.old=QS;pf.base=avg;pf.chk=3;QS=Math.max(.5,QS*.8);if(n-pf.tryUp<5000)pf.up=n+60000;pf.lo=0;pf.ok=0;rs()}
      else if(pf.ok>=8000&&QS<QMAX&&n>pf.up){QS=Math.min(QMAX,QS*1.15);pf.tryUp=n;pf.ok=0;rs()}}}
  pf.f=0;pf.t=0;pf.w=0;pf.s=n}
let last=performance.now();
function frame(n){const ft=n-last,dt=Math.min(.05,ft/1000);last=n;perf(n,ft);T+=dt;env(dt);{const c=2*Math.PI;if(RAIN>.05||wph>0){wph+=dt*3.2;if(wph>=c)wph=RAIN>.05?wph-c:0}}
  if(TOUCH){checkGate();syncTC()}
  if(st=='drive'&&!book&&!cq&&!dq&&!pz&&gateOK)update(dt);
  render();audio();hud();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
</script></body></html>
